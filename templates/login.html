{% extends "base_public.html" %}
{% block title %}Log in - BI Copilot{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <div class="subtitle">Log in to see your business dashboard.</div>

    {% if error %}<div class="form-error">{{ error }}</div>{% endif %}

    <form method="post" action="/login">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <p style="text-align:center; margin-top:18px; font-size:0.88rem;">
      Don't have an account? <a href="/signup">Sign up</a>
    </p>
  </div>
</div>
{% endblock %}
