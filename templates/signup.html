{% extends "base_public.html" %}
{% block title %}Sign up - BI Copilot{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <h1>Create your account</h1>
    <div class="subtitle">Start analyzing your business data in minutes.</div>

    {% if error %}<div class="form-error">{{ error }}</div>{% endif %}

    <form method="post" action="/signup">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="6">
        <div class="hint">At least 6 characters.</div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>

    <p style="text-align:center; margin-top:18px; font-size:0.88rem;">
      Already have an account? <a href="/login">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
